# fly.toml app configuration file generated for affairsbot on 2026-03-09T20:55:58+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'affairsbot'
primary_region = 'ams'

[build]

[env]
  TIMEZONE = 'Asia/Singapore'
  SUBSCRIBERS_FILE = '/data/subscribers.json'
  WEBHOOK_URL = 'https://affairsbot.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true

[mounts]
  source = 'affairsbot_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
